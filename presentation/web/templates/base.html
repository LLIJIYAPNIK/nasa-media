<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}nasa-media{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', path='css/fonts.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/layout.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/glass.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/sky-nightreign.css') }}">
{% block extra_css %}{% endblock %}
{% block import_map %}{% endblock %}
</head>
<body>
<canvas class="stars" aria-hidden="true"></canvas>
<nav class="nav-rail" aria-label="Основная навигация">
  <a class="nav-logo" href="/" aria-label="nasa-media — главная">n</a>
  <ul class="nav-list">
    {% for item in nav_items %}
    <li>
      <a class="nav-item{{ ' nav-item--active' if item.path == request.url.path else '' }}" href="{{ item.path }}">
        <span class="nav-icon" aria-hidden="true"></span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</nav>
<main class="page-content">
{% block content %}{% endblock %}
</main>
<script type="module" src="{{ url_for('static', path='js/starfield.js') }}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
