<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}nasa-media{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', path='css/tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/layout.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/glass.css') }}">
{% block extra_css %}{% endblock %}
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<nav class="nav-rail" aria-label="Основная навигация">
  <a class="nav-logo" href="/" aria-label="nasa-media — главная">n</a>
  <ul class="nav-list">
    {% for item in nav_items %}
    <li>
      <a class="nav-item{{ ' nav-item--active' if item.path == request.url.path else '' }}" href="{{ item.path }}">
        <span class="nav-icon" aria-hidden="true"></span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</nav>
<main class="page-content">
{% block content %}{% endblock %}
</main>
{% block extra_js %}{% endblock %}
</body>
</html>
