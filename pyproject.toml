[project]
name = "nasa-media"
version = "0.1.0"
description = "Telegram-бот на aiogram: NASA APOD/EPIC"
authors = [
    { name = "Alexander Kulebyakin" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "aiohttp>=3.14.3",
    "asyncpg>=0.31.0",
    "fastapi>=0.140.13",
    "googletrans==4.0.0rc1",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "googletrans.*"
ignore_missing_imports = true
