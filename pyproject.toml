[project]
name = "nasa-media"
version = "0.1.0"
description = "Telegram-бот на aiogram: NASA APOD/EPIC"
authors = [
    { name = "Alexander Kulebyakin" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "aiohttp>=3.14.3",
    "asyncpg>=0.31.0",
    "googletrans==4.0.0rc1",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
